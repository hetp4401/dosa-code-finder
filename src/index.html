<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dosa</title>
<!-- v31ui -->
<style>
  :root { color-scheme: dark; }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: system-ui, -apple-system, sans-serif; color: #e9edf3; max-width: 940px;
    margin: 0 auto; padding: 28px 16px 48px;
    background:
      radial-gradient(720px 340px at 50% -120px, rgba(245, 165, 36, .14), transparent 70%),
      radial-gradient(900px 500px at 85% -200px, rgba(64, 110, 255, .08), transparent 70%),
      #06080b;
    min-height: 100vh;
  }
  h1 { font-size: 1.5rem; letter-spacing: .01em; margin: 4px 0 8px; }
  .extlink {
    display: inline-block; margin: 0 0 6px; padding: 9px 14px; border-radius: 999px;
    background: rgba(245, 165, 36, .1); border: 1px solid rgba(245, 165, 36, .35);
    color: #ffb340; text-decoration: none; font-size: .9rem; font-weight: 600;
    transition: background .15s, border-color .15s;
  }
  .extlink:hover { background: rgba(245, 165, 36, .18); border-color: rgba(245, 165, 36, .6); }
  .card {
    background: linear-gradient(180deg, #12151d, #0c0f15);
    border: 1px solid #202836; border-radius: 16px; padding: 18px;
    margin: 14px 0; box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
  }
  #activeBanner {
    display: none; position: sticky; top: 10px; z-index: 10;
    background: linear-gradient(180deg, rgba(46, 32, 10, .92), rgba(30, 21, 8, .92));
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(245, 165, 36, .55); border-radius: 16px; padding: 16px 18px; margin: 14px 0;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .45);
  }
  #activeBanner.show { display: block; animation: drop .35s cubic-bezier(.2, .9, .3, 1.2); }
  @keyframes drop { from { opacity: 0; transform: translateY(-10px) scale(.98); } to { opacity: 1; transform: none; } }
  #activeBanner .banner-title { font-weight: 700; color: #ffb340; margin-bottom: 6px; }
  #activeBanner button { width: auto; padding: 10px 26px; margin-top: 10px; }
  label { display: block; font-size: .82rem; opacity: .75; margin: 8px 0 5px; }
  input {
    width: 100%; padding: 12px; font-size: 1rem; border-radius: 10px;
    border: 1px solid #232c3a; background: #090c11; color: inherit; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus { border-color: #f5a524; box-shadow: 0 0 0 3px rgba(245, 165, 36, .22); }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .btnrow { display: flex; gap: 12px; }
  .btnrow > button { flex: 1; }
  button {
    width: 100%; margin-top: 14px; padding: 13px; font-size: 1rem; border: 0; border-radius: 11px;
    background: linear-gradient(180deg, #ffb340, #ef8f14); color: #1a1206; font-weight: 700; cursor: pointer;
    box-shadow: 0 6px 18px rgba(239, 143, 20, .25);
    transition: transform .12s, filter .15s, opacity .2s, box-shadow .2s;
  }
  button:hover { filter: brightness(1.07); }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .38; cursor: default; box-shadow: none; }
  button.stop { background: linear-gradient(180deg, #c9452f, #9c2b1a); color: #ffe9e4; box-shadow: 0 6px 18px rgba(201, 69, 47, .22); }
  .statushead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .statebig { font-size: 1.35rem; font-weight: 700; margin-top: 2px; }
  .pctbig { font-size: 1.9rem; font-weight: 700; color: #ffb340; line-height: 1; }
  .bar { height: 12px; background: #090c11; border: 1px solid #1d2531; border-radius: 8px; overflow: hidden; margin: 14px 0 8px; }
  .bar > div { height: 100%; width: 0%; border-radius: 8px; background: linear-gradient(90deg, #ef8f14, #ffb340); transition: width .8s cubic-bezier(.25, .8, .3, 1); }
  .bar > div.live { background-image: linear-gradient(90deg, #ef8f14, #ffc966, #ef8f14); background-size: 200% 100%; animation: flow 1.6s linear infinite; }
  @keyframes flow { from { background-position: 0% 0; } to { background-position: 200% 0; } }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; margin-top: 14px; }
  .mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, monospace; }
  .found { color: #7ddf8a !important; font-weight: 700; }
  .err { color: #ff9a9a; min-height: 1.2em; font-size: .9rem; margin-top: 8px; }
  .k { opacity: .55; font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }
  .v { font-size: 1.05rem; margin: 2px 0 10px; }
  .fv { font-size: .98rem; margin-top: 3px; word-break: break-word; }
  #history div { padding: 7px 0; border-bottom: 1px solid #1a212d; }
  #history div:last-child { border-bottom: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px; margin-top: 12px; }
  .rep {
    background: linear-gradient(180deg, #11141b, #0a0d12);
    border: 1px solid #202836; border-radius: 14px; padding: 13px; font-size: .85rem;
    transition: transform .18s, border-color .18s, box-shadow .18s;
  }
  @media (hover: hover) { .rep:hover { transform: translateY(-2px); border-color: #2e394c; } }
  .rep.lead { border-color: rgba(245, 165, 36, .6); box-shadow: 0 0 0 1px rgba(245, 165, 36, .22), 0 8px 22px rgba(0, 0, 0, .4); }
  .rep.off { opacity: .5; }
  .rep .head { display: flex; justify-content: space-between; align-items: center; }
  .rep .id { font-weight: 700; font-size: .95rem; }
  .rep .st { text-transform: uppercase; font-size: .72rem; letter-spacing: .06em; font-weight: 700; }
  .rep .st-running::before {
    content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #ffb340; margin-right: 6px; vertical-align: 1px;
    animation: pulse 1.3s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255, 179, 64, .5); } 50% { opacity: .45; box-shadow: 0 0 0 5px rgba(255, 179, 64, 0); } }
  .rep .big { font-size: 1.45rem; font-weight: 700; margin: 9px 0 2px; font-family: ui-monospace, monospace; }
  .rep .big .unit { font-size: .76rem; font-weight: 400; opacity: .6; }
  .rep .rows { margin-top: 9px; padding-top: 9px; border-top: 1px solid #1a212d; display: grid; gap: 5px; }
  .rep .kv { display: flex; justify-content: space-between; font-size: .8rem; }
  .rep .kv .lab { opacity: .55; }
  .rep .kv .val { font-family: ui-monospace, monospace; font-weight: 600; }
  .rep .kv.stack { flex-direction: column; gap: 3px; }
  .rep .kv .segs { display: flex; flex-wrap: wrap; gap: 2px 9px; }
  .rep .kv .seg { white-space: nowrap; }
  .st-running { color: #ffb340; }
  .st-done { color: #7ddf8a; }
  .st-failed { color: #ff9a9a; }
  .st-pending { color: #9ab8ff; }
  .st-idle { color: #8fa3bd; }
  .st-working { color: #ffb340; }
  .st-cooldown { color: #c9a0ff; }
  .st-offline { color: #69707c; }
  /* Phone: 3 cards per row, compact type so the labeled rows still fit. */
  @media (max-width: 640px) {
    body { padding: 20px 10px 40px; }
    .card { padding: 14px; }
    .grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .rep { padding: 9px; border-radius: 12px; }
    .rep .id { font-size: .8rem; }
    .rep .st { font-size: .58rem; letter-spacing: .03em; }
    .rep .st-running::before { width: 5px; height: 5px; margin-right: 4px; }
    .rep .big { font-size: 1.08rem; margin: 6px 0 1px; }
    .rep .big .unit { display: block; font-size: .6rem; margin-top: 1px; }
    .rep .rows { gap: 3px; margin-top: 6px; padding-top: 6px; }
    .rep .kv { font-size: .64rem; }
    .rep .kv .lab { white-space: nowrap; }
    .facts { gap: 10px 12px; }
    .pctbig { font-size: 1.5rem; }
  }
</style>
</head>
<body>
<h1>🥘 Dosa</h1>
<a class="extlink" href="https://checktodine.com/customer_waitlist.php?businessid=110" target="_blank" rel="noopener">🍽️ View the live queue / join the waitlist ↗</a>
<div id="activeBanner">
  <div class="banner-title">🔄 Scan in progress</div>
  <div class="mono" id="bannerProgress">—</div>
  <button id="bannerStop" class="stop">Stop scan</button>
</div>
<div class="card">
  <div class="row">
    <div><label for="from">From (inclusive)</label><input id="from" type="number" min="0" max="99999" value="0"></div>
    <div><label for="to">To (exclusive)</label><input id="to" type="number" min="1" max="100000" value="100000"></div>
  </div>
  <div class="btnrow">
    <button id="start">Start scan</button>
    <button id="stop" class="stop">Stop</button>
  </div>
  <div class="err" id="err"></div>
</div>
<div class="card">
  <div class="statushead">
    <div>
      <div class="k">State</div>
      <div class="statebig" id="state">—</div>
    </div>
    <div class="pctbig mono" id="pctbig"></div>
  </div>
  <div class="bar"><div id="barfill"></div></div>
  <div class="mono" id="progress" style="font-size:.95rem; opacity:.85">—</div>
  <div class="facts">
    <div><div class="k">Range</div><div class="fv mono" id="range">—</div></div>
    <div><div class="k">Valid code</div><div class="fv mono" id="valid">—</div></div>
    <div><div class="k">Not handed out</div><div class="fv mono" id="queued">—</div></div>
    <div><div class="k">Replicas</div><div class="fv mono" id="mesh">—</div></div>
  </div>
  <div class="k" style="margin-top:14px">Message</div>
  <div class="fv" id="msg">—</div>
</div>
<div class="card">
  <div class="k">Found codes history</div>
  <div id="history" class="mono" style="font-size:.9rem">—</div>
</div>
<div class="card">
  <div class="k">Replicas</div>
  <div class="grid" id="grid"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const startBtn = $('start'), stopBtn = $('stop'), errEl = $('err');

function clamp(v, lo, hi) {
  v = Math.floor(Number(v));
  if (!Number.isFinite(v)) return lo;
  return Math.min(hi, Math.max(lo, v));
}

let pollInFlight = false;

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function repCard(r) {
  try {
    const st = r.stats || {};
    const f1 = (x) => Math.round((x || 0) * 10) / 10; // one decimal
    const errs = [];
    if (st.e429) errs.push(`${st.e429}× 429`);
    if (st.e5) errs.push(`${st.e5}× 5xx`);
    if (st.e4) errs.push(`${st.e4}× other 4xx`);
    if (st.timeouts) errs.push(`${st.timeouts}× timeout`);
    if (st.net) errs.push(`${st.net}× conn`);
    const kv = (lab, val) => `<div class="kv"><span class="lab">${lab}</span><span class="val">${val}</span></div>`;
    return `<div class="rep${r.leader ? ' lead' : ''}${r.state === 'offline' ? ' off' : ''}">
      <div class="head"><span class="id">#${r.id || '?'}${r.leader ? ' ★' : ''}</span><span class="st st-${r.state === 'working' ? 'running' : (r.state || 'unknown')}">${esc(r.state || 'unknown')}</span></div>
      <div class="big">${(r.tried || 0).toLocaleString()} <span class="unit">codes answered</span></div>
      <div class="rows">
        ${kv('Speed', `${f1(r.rate)}/s`)}
        ${kv('Limit', `${f1(st.pace)}/s`)}
        ${kv('Waiting', (r.buffer_len || 0).toLocaleString())}
        ${errs.length ? `<div class="kv stack"><span class="lab">Pushback</span><span class="val segs">${errs.map(e => `<span class="seg">${e}</span>`).join('')}</span></div>` : ''}
        ${st.retrying ? kv('Retrying', st.retrying.toLocaleString()) : ''}
      </div>
    </div>`;
  } catch (e) {
    return `<div class="rep"><span class="id">#${r && r.id || '?'}</span><span class="st">error</span></div>`;
  }
}

async function refresh() {
  if (pollInFlight) return;
  pollInFlight = true;
  // Stop is always clickable, even if this poll fails.
  stopBtn.disabled = false;
  try {
    const r = await fetch('/orchestrate/status?_=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const s = await r.json();
    const dryTag = s.dry_run ? ' 🧪 DRY RUN' : '';
    const stateLabel = (s.running ? 'Running' :
      (s.state === 'done' && s.found ? 'Done — found!' :
       s.state === 'done' ? 'Done' :
       s.state === 'failed' ? 'Failed' :
       s.state === 'stopped' ? 'Stopped' : 'Idle')) + dryTag;
    $('state').textContent = stateLabel;
    $('range').textContent = s.range || '—';
    const pct = s.total > 0 ? Math.min(100, Math.floor(100 * s.tried / s.total)) : 0;
    $('progress').textContent = s.total > 0
      ? `${s.tried.toLocaleString()} / ${s.total.toLocaleString()} (${pct}%)`
      : '—';
    $('barfill').style.width = pct + '%';
    $('barfill').classList.toggle('live', !!s.running);
    $('pctbig').textContent = s.total > 0 ? pct + '%' : '';
    const validEl = $('valid');
    validEl.textContent = s.valid_code || '—';
    validEl.classList.toggle('found', !!s.found);
    $('msg').textContent = s.message || '—';
    $('queued').textContent = s.running ? (s.queued || 0).toLocaleString() + ' codes' : '—';
    // History.
    const hist = s.history || [];
    $('history').innerHTML = hist.length
      ? hist.slice().reverse().map(h =>
          `<div>✅ <b>${esc(h.code)}</b> — ${esc(h.found_at)} — range ${esc(h.range)} — replica #${h.replica}</div>`
        ).join('')
      : '—';
    $('grid').innerHTML = (s.replicas || []).map(repCard).join('');
    $('mesh').textContent = `${s.connected} of ${s.replica_count} connected (this is #${s.me}; a scan needs ${s.quorum})` +
      (s.leader ? ` · led by #${s.leader} ★` : '');
    startBtn.disabled = s.running;
    startBtn.textContent = s.running ? 'Scanning…' : 'Start scan';

    // Active scan banner.
    const banner = $('activeBanner');
    if (s.running) {
      banner.classList.add('show');
      const pct = s.total > 0 ? Math.min(100, Math.floor(100 * s.tried / s.total)) : 0;
      $('bannerProgress').textContent =
        `${s.range || ''} — ${s.tried.toLocaleString()} / ${s.total.toLocaleString()} (${pct}%)`;
    } else {
      banner.classList.remove('show');
    }
  } catch (e) { /* keep last state on poll failure */ }
  pollInFlight = false;
}

startBtn.addEventListener('click', async () => {
  errEl.textContent = '';
  const from = clamp($('from').value, 0, 99999);
  const to = clamp($('to').value, 1, 100000);
  $('from').value = from; $('to').value = to;
  if (from >= to) { errEl.textContent = 'Need From < To (To is exclusive).'; return; }
  startBtn.disabled = true;
  startBtn.textContent = 'Scanning…';
  let started = false;
  try {
    const r = await fetch(`/orchestrate/start?from=${from}&to=${to}`);
    const body = await r.json().catch(() => null);
    if (!body) {
      errEl.textContent = `Unexpected server response (${r.status}).`;
    } else if (!r.ok || !body.ok) {
      errEl.textContent = body.error || `Server error (${r.status}).`;
    } else {
      started = true;
    }
  } catch (e) { errEl.textContent = 'Could not reach server.'; }
  if (!started) {
    startBtn.disabled = false;
    startBtn.textContent = 'Start scan';
  }
  refresh();
});

stopBtn.addEventListener('click', async () => {
  errEl.textContent = '';
  stopBtn.disabled = true;
  try {
    const r = await fetch('/orchestrate/stop');
    const body = await r.json().catch(() => null);
    if (body && body.message) errEl.textContent = body.message;
  } catch (e) { errEl.textContent = 'Could not reach server.'; }
  refresh();
});

$('bannerStop').addEventListener('click', async () => {
  errEl.textContent = '';
  try {
    await fetch('/orchestrate/stop');
  } catch (e) { errEl.textContent = 'Could not reach server.'; }
  refresh();
});

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
