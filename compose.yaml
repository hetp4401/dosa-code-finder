# Runs the published image. The tag is the commit; the build workflow fills it in and sends this to the fleet's control plane.
x-runner:
  port: 3000
services:
  app:
    image: ghcr.io/hetp4401/dosa-code-finder:__TAG__
    ports: ["3000:3000"]
    env_file: .env # the fleet's FLEET_* variables and the app's env (ZKMETADATA_PASSWORD)
    restart: unless-stopped
