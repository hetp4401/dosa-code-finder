name: build

# Every push to main builds the image once, publishes it to ghcr.io, and deploys it to the fleet
# (https://runners.billybishop4-workers.xyz), where every machine just pulls it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # a hung build mustn't hold the next push's deploy for hours
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to the fleet
        shell: bash # a failed curl or jq fails the step, instead of a green run that deployed nothing
        env:
          URL: https://runners.billybishop4-workers.xyz/api/projects/dosa-code-finder
        run: |
          # Deploying needs no credentials (the app isn't locked). Keep the replica count the fleet already has (1 for a first deploy).
          replicas=$(curl -fsS "$URL" | jq -e '.replicas') || replicas=1
          sed "s/__TAG__/$GITHUB_SHA/" compose.yaml | jq -Rs --argjson r "$replicas" '{compose: ., port: 3000, replicas: $r}' \
            | curl -fsS -X PUT "$URL" -H 'Content-Type: application/json' --data-binary @- \
            | jq -e '{name, version, replicas, unchanged}'
