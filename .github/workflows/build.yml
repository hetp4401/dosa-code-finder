name: build

# Every push to main builds the image once, publishes it to ghcr.io, and deploys it to the fleet
# (https://control.billybishop4-workers.xyz), where every machine just pulls it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to the fleet
        env:
          FLEET_PASSWORD: ${{ secrets.FLEET_PASSWORD }}
          URL: https://control.billybishop4-workers.xyz/api/projects/dosa-code-finder
        run: |
          # Keep the replica count the fleet already has.
          replicas=$(curl -fsS "$URL" -H "x-fleet-password: $FLEET_PASSWORD" | jq '.replicas' || echo 1)
          sed "s/__TAG__/$GITHUB_SHA/" compose.yaml | jq -Rs --argjson r "$replicas" '{compose: ., port: 3000, replicas: $r}' \
            | curl -fsS -X PUT "$URL" -H "x-fleet-password: $FLEET_PASSWORD" -H 'Content-Type: application/json' --data-binary @- \
            | jq '{name, version, replicas}'
